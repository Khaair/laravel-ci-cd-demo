services:

  app:

    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_ci_cd_demo

    volumes:
      - ./app:/var/www

    depends_on:
      - mysql

  nginx:

    image: nginx:latest

    container_name: nginx

    ports:
      - "8080:80"

    volumes:
      - ./app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  mysql:

    image: mysql:8.4

    container_name: mysql

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: laravel

      MYSQL_USER: laravel

      MYSQL_PASSWORD: password

    ports:

      - "3307:3307"

    volumes:

      - mysql_data:/var/lib/mysql

volumes:

  mysql_data: